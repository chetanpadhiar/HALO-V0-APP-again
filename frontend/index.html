<title>HALO V0 - Contextual Email Trust &amp; Forensic Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --accent:#e8001d;
  --accent-dim:#8f0012;
  --bg-void:#040a12;
  --bg-frame:#091326;
  --panel:#f5f3ee;
  --rule:#d0ccc4;
  --cyan:#00f0ff;
  --cyan-bright:#00d2be;
  --ink:#151312;
  --ink-soft:#4b4740;
  --safe:#1f8f4e;
  --warn:#c47a00;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-void);color:var(--panel);font-family:'VT323',monospace;font-size:18px;}
#app{max-width:1200px;margin:0 auto;padding:20px;}

.brand{display:flex;align-items:center;gap:14px;border:3px solid var(--accent);background:var(--bg-frame);padding:14px 18px;margin-bottom:16px;}
.brand h1{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--cyan);margin:0;}
.brand p{margin:2px 0 0;color:var(--rule);font-size:15px;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.pill{border:2px solid var(--safe);color:var(--safe);padding:4px 10px;font-size:14px;}
.pill.bad{border-color:var(--warn);color:var(--warn);}

.nav{display:flex;gap:8px;border-bottom:2px solid var(--bg-frame);margin-bottom:16px;flex-wrap:wrap;}
.nav button{background:none;border:none;color:var(--rule);font-family:'VT323',monospace;font-size:18px;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;}
.nav button.active{color:var(--cyan);border-bottom-color:var(--cyan);}

.panel{background:var(--panel);color:var(--ink);border:3px solid var(--ink);padding:20px;margin-bottom:16px;}
.panel h2{font-family:'Press Start 2P',monospace;font-size:15px;margin:0 0 14px;}
.panel p{color:var(--ink-soft);}

.center-wrap{max-width:520px;margin:60px auto;text-align:center;}
.center-wrap h1{font-family:'Press Start 2P',monospace;font-size:26px;color:#fff;}
.center-wrap .tagline{color:var(--cyan);margin-bottom:30px;}

.role-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.role-card{flex:1;min-width:220px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);padding:22px;cursor:pointer;text-align:left;box-shadow:5px 5px 0 var(--cyan);}
.role-card:hover{box-shadow:5px 5px 0 var(--accent);}
.role-card h3{font-family:'Press Start 2P',monospace;font-size:14px;margin:0 0 10px;}

input[type=email], input[type=text]{width:100%;padding:12px;font-family:'VT323',monospace;font-size:18px;border:2px solid var(--ink);margin-bottom:12px;}
button.btn{width:100%;padding:12px;font-family:'VT323',monospace;font-size:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink);margin-bottom:10px;}
button.btn:active{transform:translate(4px,4px);box-shadow:none;}
button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-dim);}
button.btn.link{border:none;box-shadow:none;color:var(--cyan);background:none;}

.note{font-size:14px;color:var(--warn);border:2px dashed var(--warn);padding:10px;margin:10px 0;background:#fff8ec;}
.note.info{color:var(--ink-soft);border-color:var(--rule);background:#fff;}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
.metric-card{border:2px solid var(--ink);padding:14px;}

.metric-card .m-value{font-family:'Press Start 2P',monospace;font-size:20px;margin-top:6px;}

.row-list{border-top:2px solid var(--ink);}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);cursor:pointer;gap:10px;}
.row-item:hover{background:#efece3;}

.badge.safe{background:var(--safe);}

details summary{cursor:pointer;color:var(--cyan-bright);margin-top:14px;}
pre{white-space:pre-wrap;background:#fff;border:1px solid var(--rule);padding:10px;font-size:13px;}



/* --- HALO tracker-inspired landing + institution demo --- */

<body>
<div id="app"></div>
<!--
  HALO V0 API routing:
  - local: http://127.0.0.1:8788
  - production: same-origin /api, reverse-proxied by Vercel to the Render API
  This keeps OAuth/session cookies first-party in Safari and other browsers.
-->
<script>


/* ---- HALO V0 modular frontend bundle ---- */
// Single source of truth for talking to the backend. Nothing else in
// the frontend should call fetch() directly against these routes.
//
// PRODUCTION CONFIG: set window.HALO_API_BASE (see index.html) before
// this script loads. There is deliberately no guessed real-looking
// production URL here -- an unconfigured deployment should fail
// loudly and obviously, not silently point at a domain that may not
// exist or may not be yours.
const API_BASE = window.HALO_API_BASE || (
  (location.hostname === "" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://127.0.0.1:8788"
    : (() => {
        console.error("HALO_API_BASE is not configured. Set window.HALO_API_BASE before api.js loads (see index.html).");
        return "HALO_API_BASE_NOT_CONFIGURED";
      })()
);

async function request(path, opts = {}) {
  const resp = await fetch(API_BASE + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  let body = null;
  try { body = await resp.json(); } catch { /* no body */ }
  if (!resp.ok) {
    const err = new Error(body?.error?.message || `Request failed (${resp.status})`);
    err.status = resp.status;
    err.code = body?.error?.code;
    throw err;
  }
  return body;
}

const api = {
  detectProvider: (email) => request("/auth/detect-provider", { method: "POST", body: JSON.stringify({ email }) }),
  authorizeUrl: (provider, email, role) => `${API_BASE}/auth/${provider}/authorize?email=${encodeURIComponent(email)}&role=${role}`,
  mockLogin: (email, role) => request("/auth/mock-login", { method: "POST", body: JSON.stringify({ email, role }) }),
  logout: () => request("/auth/logout", { method: "POST" }),
  me: () => request("/me"),
  integrations: () => request("/system/integrations"),

  studentDashboard: () => request("/dashboard/student"),
  listEmails: () => request("/emails"),
  getEmail: (id) => request(`/emails/${id}`),
  scanDemoInbox: (emails) => request("/emails/scan", { method: "POST", body: JSON.stringify({ emails }) }),
  scanRealInbox: () => request("/emails/scan", { method: "POST", body: JSON.stringify({}) }),

  institutionDashboard: () => request("/dashboard/institution"),
  threatRadar: () => request("/institution/threat-radar"),
  geoInfrastructure: () => request("/institution/geo/infrastructure"),
  timeline: () => request("/institution/timeline"),
  trends: () => request("/institution/trends"),
  listCampaigns: () => request("/campaigns"),
  getCampaign: (id) => request(`/campaigns/${id}`),
  setCampaignStatus: (id, status) => request(`/campaigns/${id}/status`, { method: "POST", body: JSON.stringify({ status }) }),
};

// HALO terminology system: every technical finding has a plain-language
// form for the primary UI, with the technical wording preserved for the
// "Technical details" panel. This is the ONE place that mapping lives --
// screens should call these helpers rather than hard-coding wording.

const REASON_MAP = [
  // Identity/authentication
  [/^SPF check: FAIL/i, "HALO could not confirm this message really came from where it claims to."],
  [/^DKIM check: FAIL/i, "HALO could not confirm this message really came from where it claims to."],
  [/^DMARC check: FAIL/i, "HALO could not confirm this message really came from where it claims to."],
  [/check: NOT PRESENT/i, "HALO couldn't fully verify who sent this message."],
  [/resembles protected brand/i, "This sender's address looks like it's imitating a well-known organisation."],
  [/Reply-To domain .* does not match/i, "The address you'd actually reply to is different from the one that sent this message."],

  // Links
  [/point directly to a numeric IP address/i, "Be careful with the website this message wants you to visit."],
  [/lookalike \(punycode\) domain/i, "Be careful with the website this message wants you to visit -- its address may be disguised."],
  [/point to a different domain than the sender/i, "The link in this message doesn't go where the sender's address suggests."],
  [/unusually long chain of subdomains/i, "Be careful with the website this message wants you to visit."],

  // Content intent (already fairly plain -- lightly normalized)
  [/asks for a password, login, or verification code/i, "This message asks for your password or a security code."],
  [/asks for a payment or financial details/i, "This message asks you to send money or share financial details."],
  [/creates urgency or a tight deadline/i, "This message is pressuring you to act quickly."],
  [/Wording matches common credential-request phrases/i, "This message asks for your password or a security code."],
  [/Wording matches common payment-request phrases/i, "This message asks you to send money."],
  [/trained model's overall assessment flags this message/i, "HALO's overall analysis found this message concerning."],

  // Behaviour
  [/never previously requested credentials.*this message does/i, "This is different from how this sender normally communicates -- they've never asked for a password before."],
  [/never previously requested payment.*this message does/i, "This is different from how this sender normally communicates -- they've never asked for payment before."],
  [/Sender has \d+ prior message/i, "HALO has seen this sender before."],
  [/Request type is consistent with this sender's prior messages/i, "This matches how this sender normally communicates."],

  // Infrastructure (keep the plain framing already used elsewhere in the app)
  [/^Observed infrastructure:/i, "This message was sent through hosting that HALO has flagged as higher-risk."],
];

/** Turns one raw backend "reasons" string into a plain-language sentence
 * for the primary UI. Falls back to the original text (cleaned up) if no
 * mapping matches, rather than hiding a real finding. */
function simpleReason(raw) {
  for (const [pattern, plain] of REASON_MAP) {
    if (pattern.test(raw)) return plain;
  }
  return raw;
}

/** The exact raw evidence string, for the technical panel -- always
 * available even when simpleReason() had a mapping, so nothing is lost. */
function technicalReason(raw) {
  return raw;
}

const VERDICT_COPY = {
  safe: { badge: "LOOKS SAFE", headline: "HALO found no major warning signs.", tone: "safe" },
  attention: { badge: "NEEDS ATTENTION", headline: "Something about this message is unusual -- it deserves a second look.", tone: "attention" },
  "high-risk": { badge: "HIGH RISK", headline: "This message may not be safe.", tone: "high-risk" },
};

function simpleVerdict(bucket) {
  return VERDICT_COPY[bucket] || VERDICT_COPY.attention;
}

function recommendedActions(bucket) {
  if (bucket === "safe") return ["This message looks fine to act on normally."];
  if (bucket === "high-risk") {
    return [
      "Don't click links or share information.",
      "Don't send your password or a security code.",
      "Verify the request another way before acting.",
      "Report this message if you're unsure.",
    ];
  }
  return [
    "Double-check before you act on this.",
    "Verify the sender through another channel if it asks for anything sensitive.",
  ];
}

function confidenceExplanation(confidence) {
  const label = (confidence?.label || "medium").toLowerCase();
  if (label === "high") return "HALO is fairly confident in this assessment.";
  if (label === "low") return "HALO has limited information here, so treat this assessment as a starting point, not the final word.";
  return "HALO has a reasonable amount of information to base this on.";
}

function trustScoreInterpretation(score) {
  if (score >= 75) return "HALO found no major warning signs.";
  if (score >= 45) return "HALO is not fully confident that this message is safe.";
  return "HALO found several warning signs and is not confident this message is safe.";
}

/** Sender Trust Profile -- built entirely from signals the engine
 * already computes (behavior.seen_before/status, identity flags,
 * infrastructure category). Never invents a baseline: when there's
 * insufficient history, it says so plainly rather than guessing. */
function senderTrustProfile(raw) {
  const behavior = raw.signals?.behavior;
  const identity = raw.signals?.identity;
  const infra = raw.signals?.infrastructure;
  const domain = raw.parsed?.from_domain || "unknown domain";

  let label, headline;
  if (infra?.flagged) {
    label = "SUSPICIOUS";
    headline = "This sender is associated with suspicious infrastructure.";
  } else if (identity?.flagged) {
    label = "SUSPICIOUS";
    headline = "HALO could not confirm this sender's identity.";
  } else if (behavior?.seen_before) {
    label = "KNOWN";
    headline = "HALO has seen this sender before.";
  } else {
    label = "NEW";
    headline = behavior?.status === "insufficient_history" ? "Not enough history yet." : "HALO hasn't seen this sender before.";
  }

  const facts = [];
  facts.push(["Domain", domain]);
  facts.push(["Previously seen by HALO", behavior?.seen_before ? "Yes" : "Not enough history yet"]);
  if (behavior?.evidence?.[0]) facts.push(["Recent behavior", simpleReason(behavior.evidence[0])]);
  if (identity?.homograph_of) facts.push(["Identity note", `This address resembles ${identity.homograph_of}, a well-known organisation, but is not the same domain.`]);
  if (infra?.org) facts.push(["Sending infrastructure", `${infra.org}${infra.category ? ` (${infra.category})` : ""}`]);

  return { label, headline, facts };
}

/** Structures raw `signals` into the human-organized technical sections
 * from the spec (IDENTITY / DOMAIN / MESSAGE SIGNALS / BEHAVIOUR /
 * INFRASTRUCTURE / MODEL) instead of a raw JSON dump. */
function technicalSections(raw) {
  const s = raw.signals || {};
  const p = raw.parsed || {};
  const sections = [];

  if (s.identity) {
    sections.push({
      title: "IDENTITY CHECK",
      rows: [
        ["SPF", p.auth?.spf || "UNKNOWN"],
        ["DKIM", p.auth?.dkim || "UNKNOWN"],
        ["DMARC", p.auth?.dmarc || "UNKNOWN"],
        ["Reply-To mismatch", s.identity.reply_to_mismatch ? "YES" : "NO"],
        ["Lookalike domain", s.identity.homograph_of || "None detected"],
      ],
    });
  }
  sections.push({
    title: "DOMAIN",
    rows: [
      ["Sending domain", p.from_domain || "unknown"],
      ["Reply-To domain", p.reply_to_domain || "(same as sender)"],
    ],
  });
  if (s.content_intent) {
    sections.push({
      title: "MESSAGE SIGNALS",
      rows: [
        ["Credential request", s.content_intent.has_credential_request ? "DETECTED" : "not detected"],
        ["Payment request", s.content_intent.has_payment_request ? "DETECTED" : "not detected"],
        ["Urgency language", s.content_intent.has_urgency ? "DETECTED" : "not detected"],
      ],
    });
  }
  if (s.url_domain) {
    sections.push({
      title: "LINK SAFETY",
      rows: [
        ["Suspicious link structure", s.url_domain.flagged ? "DETECTED" : "not detected"],
        ["Finding", s.url_domain.evidence?.[0] || "n/a"],
        ["Live reputation check", "Additional reputation data unavailable -- no live reputation provider is configured (see GEOIP_PROVIDER-style config in .env.example for how one would be added)."],
      ],
    });
  }
  if (s.behavior) {
    sections.push({
      title: "BEHAVIOUR",
      rows: [
        ["Previously seen sender", s.behavior.seen_before ? "YES" : "NO / insufficient history"],
        ["Status", s.behavior.status || "unknown"],
      ],
    });
  }
  if (s.infrastructure) {
    sections.push({
      title: "INFRASTRUCTURE",
      rows: [
        ["Origin IP", s.infrastructure.ip || "not available"],
        ["Confidence", s.infrastructure.confidence || "none"],
      ],
    });
  }
  sections.push({
    title: "MODEL",
    rows: [
      ["Model", s.content_intent?.model_name || "unknown"],
      ["Model probability (malicious)", s.content_intent?.probability_malicious != null ? s.content_intent.probability_malicious.toFixed(4) : "n/a"],
      ["Trust score", String(raw.trust_score ?? "n/a")],
      ["Confidence", raw.confidence?.label || "unknown"],
    ],
  });
  return sections;
}

// HALO V0 Demo Dataset
// 247 synthetic student-inbox messages: 10 high-risk, 10 needs-attention, 227 looks-safe.
// The scenarios are intentionally synthetic and designed to exercise the real HALO UI/workflows offline.
const DEMO_EMAILS = [
  {

// ---------------------------------------------------------------- boot animation
async function runBootAnimation() {
  // Phase 1 -- system wake: dark screen, small indicators powering up.
  root.innerHTML = `<div class="center-wrap halo-boot">
    <div class="halo-boot-dots">
      ${Array.from({ length: 8 }).map((_, i) => `<span class="halo-boot-dot" style="animation-delay:${i * 55}ms"></span>`).join("")}
    </div>
  </div>`;
  await sleep(380);

  // Phase 2 -- HALO assembles via a scan-line wipe, not a plain fade.
  root.innerHTML = `<div class="center-wrap halo-boot">
    <div class="halo-logo-assemble"><h1>HALO</h1><div class="halo-scan-bar"></div></div>
  </div>`;
  await sleep(480);

  // Phase 3 -- security core ring + module activation checklist.
  const modules = ["IDENTITY", "MAIL", "ML", "BEHAVIOR", "INFRASTRUCTURE", "CAMPAIGNS"];
  let revealed = [];
  for (const m of modules) {
    revealed.push(m);
    root.innerHTML = `<div class="center-wrap halo-boot">
      <h1>HALO</h1>
      <div class="halo-core-wrap">
        <svg class="halo-core-ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" class="hcr-track"/><circle cx="60" cy="60" r="50" class="hcr-sweep"/></svg>
        <div class="panel" style="text-align:left;min-width:220px;">
          <h2>INITIALIZING HALO...</h2>
          <pre style="background:none;border:none;font-size:16px;">${esc(revealed.map((r) => r.padEnd(15, ".") + " OK").join("\n"))}</pre>
        </div>
      </div>
    </div>`;
    await sleep(190);
  }

  // Phase 4 -- network wake: nodes light up and connect.
  root.innerHTML = `<div class="center-wrap halo-boot">
    <h1>HALO</h1>
    <svg class="halo-boot-network" viewBox="0 0 400 160">
      <line x1="60" y1="40" x2="160" y2="80" class="hbn-line"/>
      <line x1="160" y1="80" x2="120" y2="130" class="hbn-line" style="animation-delay:.12s"/>
      <line x1="240" y1="35" x2="300" y2="90" class="hbn-line" style="animation-delay:.2s"/>
      <line x1="160" y1="80" x2="240" y2="35" class="hbn-line" style="animation-delay:.28s"/>
      <line x1="300" y1="90" x2="340" y2="130" class="hbn-line" style="animation-delay:.36s"/>
      <circle cx="60" cy="40" r="4" class="hbn-dot"/>
      <circle cx="160" cy="80" r="5" class="hbn-dot" style="animation-delay:.12s"/>
      <circle cx="120" cy="130" r="4" class="hbn-dot" style="animation-delay:.2s"/>
      <circle cx="240" cy="35" r="4" class="hbn-dot" style="animation-delay:.28s"/>
      <circle cx="300" cy="90" r="4" class="hbn-dot" style="animation-delay:.36s"/>
      <circle cx="340" cy="130" r="4" class="hbn-dot" style="animation-delay:.44s"/>
    </svg>
  </div>`;
  await sleep(420);

  // Phase 5 -- final status.
  root.innerHTML = `<div class="center-wrap halo-boot"><h1>HALO</h1><div class="tagline halo-boot-online">HALO SYSTEM<br>ONLINE</div></div>`;
  await sleep(420);
}

async function boot() {
  if (!sessionStorage.getItem("halo_booted")) {
    await runBootAnimation();
    sessionStorage.setItem("halo_booted", "1");
  }
  try {
    APP.user = await api.me();
    APP.screen = APP.user.role === "institution" ? "institution-dashboard" : "student-dashboard";
  } catch {
    APP.user = null;
  }
  render();
  if (APP.screen === "student-dashboard") loadStudentDashboard();
  if (APP.screen === "institution-dashboard") loadInstitutionDashboard();
}

function render() {
  root.innerHTML = topbar() + body();
  wire();
}

function topbar() {
  if (!APP.user) return "";
  const connected = !APP.demoMode && APP.user.auth_provider && APP.user.auth_provider !== "mock";
  const providerLabel = connected ? "Google" : null;
  return `<div class="topbar">
    <div class="pill${connected ? "" : " bad"}">${esc(APP.user.email)} &middot; ${APP.user.role.toUpperCase()}${providerLabel ? ` &middot; ${providerLabel} account connected` : " &middot; DEMO MODE -- SYNTHETIC DATA"}</div>
    <button class="btn link" data-action="logout" style="width:auto;">LOGOUT</button>
  </div>`;
}

function body() {
  switch (APP.screen) {
    case "role-select": return screenRoleSelect();
    case "email-entry": return screenEmailEntry();
    case "connect": return screenConnect();
    case "student-dashboard": return screenStudentDashboard();
    case "email-detail": return screenEmailDetail();
    case "institution-dashboard": return screenInstitutionDashboard();
    case "geo-infrastructure": return screenGeoInfrastructure();
    case "timeline": return screenTimeline();
    case "trends": return screenTrends();
    case "campaign-detail": return screenCampaignDetail();
    case "incident-center": return screenIncidentCenter();
    case "incident-detail": return screenIncidentDetail();
    default: return `<div class="panel"><p>Unknown screen.</p></div>`;
  }
}

  studentDashboardData = await api.studentDashboard();

  if (!mount) return;

    mount.innerHTML = `<p>No emails yet.</p>`;

  }
  mount.innerHTML = `<div class="row-list">` + emails.emails.map((e) => `
    <div class="row-item" data-action="open-email" data-id="${e.id}">

        <div>${esc(e.subject || "(no subject)")}</div>

      </div>
      <span class="badge ${e.bucket}">${simpleVerdict(e.bucket).badge}</span>
    </div>`).join("") + `</div>`;
  renderActivityFeed(emails.emails.map((e) => ({ label: e.bucket === "safe" ? `Sender verified: "${e.subject || "(no subject)"}"` : `${e.bucket === "high-risk" ? "High-risk" : "Suspicious"} email detected: "${e.subject || "(no subject)"}"`, timestamp: e.received_at })));
}

function renderActivityFeed(events) {
  const mount = document.getElementById("activityListMount");
  if (!mount) return;
  if (events.length === 0) {
    mount.innerHTML = `<p>No activity yet.</p>`;
    return;
  }
  const sorted = [...events].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 6);
  mount.innerHTML = `<div class="row-list">` + sorted.map((e) => `
    <div class="row-item">
      <div>
        <div class="note info" style="border:none;padding:0;margin:0;">${new Date(e.timestamp).toLocaleString()}</div>
        <div>${esc(e.label)}</div>
      </div>
    </div>`).join("") + `</div>`;
}

// ---------------------------------------------------------------- world map
// Simple equirectangular projection (lon/lat -> x/y). No map library,
// no CDN -- a plain SVG path per country, built from GEO_COUNTRIES.
function renderWorldMapSVG(nodes) {
  const W = 700, H = 360;
  const project = ([lon, lat]) => [((lon + 180) / 360) * W, ((90 - lat) / 180) * H];
  const countryPaths = Object.values(GEO_COUNTRIES).map((ring) => {
    const d = ring.map((pt, i) => `${i === 0 ? "M" : "L"}${project(pt).join(",")}`).join(" ") + "Z";
    return `<path d="${d}" fill="#0d1f38" stroke="var(--cyan)" stroke-width="0.5" opacity="0.55"/>`;
  }).join("");
  const markers = nodes.map((n, idx) => {
    const coords = GEO_CITY_COORDS[n.region];
    if (!coords) return "";
    const [x, y] = project(coords);
    const tone = n.risk_score >= 70 ? "high" : n.risk_score >= 40 ? "mid" : "low";
    const color = tone === "high" ? "var(--accent)" : tone === "mid" ? "var(--warn)" : "var(--safe)";
    return `<g class="halo-map-node" data-action="focus-infra-node" data-ip="${esc(n.ip)}" style="cursor:pointer;">
      <circle cx="${x}" cy="${y}" r="10" fill="${color}" opacity="0.18" class="halo-node-halo"/>
      <circle cx="${x}" cy="${y}" r="5" fill="${color}" stroke="#04060a" stroke-width="1.2" filter="url(#halo-node-glow)"/>
      <title>${esc(n.org)} -- ${esc(n.region || "")}, ${esc(n.country || "")} (${tone === "high" ? "high-risk" : tone === "mid" ? "suspicious" : "low concern"})</title>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:radial-gradient(ellipse at 50% 40%, #0a1a30 0%, #050b16 80%);border:2px solid var(--cyan);">
    <defs>
      <filter id="halo-node-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="halo-map-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0V24" fill="none" stroke="var(--cyan)" stroke-width="0.3" opacity="0.15"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#halo-map-grid)"/>
    ${countryPaths}${markers}
  </svg>
  <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--ink-soft);">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:5px;"></span>High-risk</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-right:5px;"></span>Suspicious</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--safe);margin-right:5px;"></span>Low concern</span>
    <span style="margin-left:auto;letter-spacing:0.03em;">OBSERVED INFRASTRUCTURE -- LOCATION APPROXIMATE</span>
  </div>`;
}

function demoLinkIntel(r) {
  const domain = r?.from_address?.split("@")[1] || "unknown.example";
  const n = Number(String(r?.id || "d1").replace(/\D/g, "")) || 1;
  const suspicious = r?.bucket === "high-risk";
  const hasLikelyLink = suspicious || r?.bucket === "attention";
  if (!hasLikelyLink) return { original: null, domain, age: "Not applicable", redirects: 0, infrastructure: "No suspicious destination observed", verdict: "NO LINK FLAGGED" };
  const redirects = suspicious ? (n % 3) + 1 : n % 2;
  const ages = suspicious ? ["3 days", "11 days", "24 days", "31 days"] : ["7 months", "2 years", "Unknown"];
  const age = ages[n % ages.length];
  const infraCount = suspicious ? ((n * 3) % 4) + 1 : (n % 2) + 1;
  const path = suspicious ? ["verify", "login", "claim", "secure", "confirm"][n % 5] : ["review", "document", "invite"][n % 3];
  return {
    original: `https://${domain}/${path}`,
    domain,
    age: suspicious ? `Recently registered (${age} ago)` : `Established domain (${age})`,
    redirects,
    infrastructure: `${infraCount} related message${infraCount === 1 ? "" : "s"} in this demo dataset`,
    verdict: suspicious ? "HIGH RISK" : "REVIEW"
  };
}

  const i = demoLinkIntel(r);

// AFTER render() already ran) without needing to re-attach listeners.
root.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (el) handleAction(el.dataset.action, el.dataset);
});
function wire() { /* no-op: delegation above covers all current and future elements */ }

async function handleAction(action, data) {
  APP.error = null;
  try {
    if (action === "pick-role") { APP.role = data.role; APP.error = null; APP.screen = "connect"; render(); }
    else if (action === "back-role") { APP.screen = "role-select"; render(); }
    else if (action === "submit-email") {
      const email = document.getElementById("emailInput").value.trim();
      if (!email.includes("@")) { APP.error = "Please enter a valid email address."; render(); return; }
      APP.email = email;
      try {
        const { provider } = await api.detectProvider(email);
        APP.detectedProvider = provider === "unknown" ? null : provider;
      } catch {
        // Detection is a convenience, not a hard requirement -- a
        // transient DNS/network hiccup here must not block the user
        // from reaching the connect screen at all.
        APP.detectedProvider = null;
      }
      APP.screen = "connect"; render();
    }
    else if (action === "connect") {
      // No email is collected upfront -- the provider's own OAuth
      // response determines the account, never a client-typed address.
      window.location.href = api.authorizeUrl(data.provider, "", APP.role);
      // If the provider isn't configured, the backend responds with JSON
      // (not a redirect); the browser will show that response directly
      // rather than navigating to a provider's consent screen. That is
      // the honest "not configured" state, not a bug.
    }
    else if (action === "demo-login") {
      await enterDemoMode();
    }
    else if (action === "logout") {
      if (!APP.demoMode) await api.logout();
      APP.user = null; APP.role = null; APP.email = null; APP.demoMode = false;
      studentDashboardData = null; institutionDashboardData = null;
      APP.screen = "role-select"; render();
    }
    else if (action === "run-demo-scan") {
      await enterDemoMode();
    }
    else if (action === "run-real-scan") {
      await api.scanRealInbox();
      await loadStudentDashboard();
    }
    else if (action === "download-email-report") { const r=getActionRecord(APP.currentEmailId); const raw=r?.raw_result_json ? JSON.parse(r.raw_result_json) : (r?.raw_result || {}); const text=`HALO EMAIL INCIDENT EVIDENCE\n==========================\nSubject: ${r?.subject || ""}\nSender: ${r?.from_address || ""}\nVerdict: ${r?.bucket || ""}\nTrust score: ${raw.trust_score ?? "n/a"}/100\n\nReasons\n${(raw.reasons||[]).map(x=>`- ${x}`).join("\n")}\n\nThis evidence package was prepared from HALO's read-only Gmail analysis. It does not claim that any mailbox action was performed.`; const blob=new Blob([text],{type:"text/plain"}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=`HALO-email-evidence-${r?.id || "message"}.txt`; a.click(); URL.revokeObjectURL(u); }
    else if (action === "download-report") {
      const text = buildIncidentReportText(campaignDetailData);
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `HALO-incident-report-${campaignDetailData.id}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
    else if (action === "view-trends") {
      trendsData = APP.demoMode ? DEMO_TRENDS : await api.trends();
      APP.screen = "trends"; render();
    }
    else if (action === "demo-filter") { renderDemoStudentLists(data.filter || "all"); }
    else if (action === "take-action") { const r = getActionRecord(data.id); if(r) actionModalFor(r); }
    else if (action === "close-modal") { document.querySelector(".halo-modal-backdrop")?.remove(); }
    else if (action === "action-quarantine") { showModal("REMOVE FROM INBOX",`<p>What would you like to do?</p>${APP.demoMode ? "" : '<p class="note info">Real Gmail access is read-only. The choices below are simulated for the demo and will not modify the mailbox.</p>'}<button class="action-card" data-action="action-quarantine-confirm"><strong>MOVE TO QUARANTINE</strong><span>Keep the email for investigation but remove it from the student's normal inbox.</span></button><button class="action-card" data-action="action-delete"><strong>DELETE</strong><span>Permanently remove the message.</span></button>`); }
    else if (action === "action-quarantine-confirm") { showModal(APP.demoMode ? "QUARANTINED" : "SIMULATED ACTION",`<p>${APP.demoMode ? "Message moved to quarantine in this demo workflow." : "Quarantine is not connected to the real Gmail mailbox because HALO uses read-only access."}</p><span class="badge attention">${APP.demoMode ? "DEMO ACTION" : "READ-ONLY"}</span>`); }
    else if (action === "action-delete") { showModal(APP.demoMode ? "MESSAGE REMOVED" : "SIMULATED ACTION",`<p>${APP.demoMode ? "Message marked for deletion in this demo workflow." : "Deletion is not connected to the real Gmail mailbox because HALO uses read-only access."}</p><span class="badge attention">${APP.demoMode ? "DEMO ACTION" : "READ-ONLY"}</span>`); }
    else if (action === "action-block") { const r=getActionRecord(data.id); showModal("BLOCK SENDER",`<p><strong>Sender:</strong> ${esc(r?.from_address||"")}</p><p>Blocking is a protective action and should be applied carefully.</p>${APP.demoMode ? `<button class="btn primary" data-action="action-block-confirm">CONFIRM BLOCK</button>` : `<p class="note info">Real Gmail access is read-only, so HALO cannot change the sender block list from this screen.</p>`}`); }
    else if (action === "action-block-confirm") { showModal("SENDER BLOCKED",`<p>Sender blocked in this demo workflow.</p><span class="badge attention">DEMO ACTION</span><p class="note info">No real Gmail settings were changed.</p>`); }
    else if (action === "action-link") { const r=getActionRecord(data.id); if(r) linkInspection(r); }
    else if (action === "action-related") { const r=getActionRecord(data.id); const related = r?.bucket === "high-risk" ? DEMO_CAMPAIGN.related_emails.length : 3; showModal("RELATED MESSAGES",`<p>HALO found <strong>${related} related message${related===1?"":"s"}</strong> in the demo environment.</p><p>Connections use contextual evidence: sender patterns, domains, wording, URLs and observed infrastructure.</p><span class="badge ${r?.bucket === "high-risk" ? "high-risk" : "attention"}">${r?.bucket === "high-risk" ? "CAMPAIGN CORRELATED" : "RELATED ACTIVITY"}</span>`); }
    else if (action === "action-account") { showModal("ACCOUNT PROTECTION",`<ol><li>Change your password.</li><li>Sign out of other sessions.</li><li>Review recent account activity.</li><li>Enable MFA if available.</li><li>Contact your institution's cybersecurity team.</li></ol>`); }
    else if (action === "action-report") { const r=getActionRecord(data.id); if(APP.demoMode){ createDemoIncident(r); showModal("INCIDENT CREATED",`<h3>${esc(DEMO_INCIDENT.id)}</h3><p><strong>${r?.bucket === "high-risk" ? "REPORTED" : "REPORTED FOR REVIEW"} → UNDER REVIEW</strong></p><p>HALO attached the message analysis and contextual evidence to a structured incident.</p><button class="btn primary" data-action="open-incident" style="width:auto;margin-top:10px;">OPEN INCIDENT</button>`); } else { showModal("REPORT PACKAGE",`<p>HALO prepared the evidence for institutional review.</p><ul class="reasons"><li>Original message and sender identity</li><li>HALO risk assessment and reasons</li><li>Authentication and URL evidence</li><li>Available infrastructure/context signals</li></ul><p class="note info">Your current Gmail permission is read-only, so HALO does not claim to send, delete, quarantine or block the real message from this screen.</p><button class="btn primary" data-action="download-email-report" style="width:auto;">DOWNLOAD EVIDENCE</button>`); } }
    else if (action === "incident-created") { createDemoIncident(getActionRecord(APP.currentEmailId)); showModal("INCIDENT CREATED",`<h3>${esc(DEMO_INCIDENT.id)}</h3><p><strong>REPORTED → UNDER REVIEW</strong></p><p>The cybersecurity team now has a structured case instead of a manual report.</p>`); }
    else if (["action-review","action-verify","action-open","action-analysis","action-sender","action-trust"].includes(action)) { const m={"action-review":"Review the message carefully without opening unknown links or attachments.","action-verify":"Verify the sender through a trusted channel.","action-open":"This message is currently classified as Looks Safe.","action-analysis":"Open Technical Details to inspect the signals used by HALO.","action-sender":"Review sender identity, authentication and behavioural history.","action-trust":"Sender marked as trusted in this demo workflow."}[action]; showModal("HALO GUIDANCE",`<p>${m}</p>`); }
    else if (action === "institution-response") { APP.screen="incident-detail"; render(); }
    else if (action === "open-incident") { APP.screen="incident-detail"; render(); }
    else if (action === "protect-campus") { showModal("ACTION RECORDED",`<p>The selected response has been recorded in the demo incident workflow.</p><span class="badge safe">DEMO ACTION COMPLETE</span><p class="note info">Demo only: no Gmail messages, mail-gateway rules, or student notifications were changed.</p>`); }
    else if (action === "report-suspicious") {
      // No backend endpoint exists yet for institution-side reporting,
      // so this is honestly local-only feedback, not a real submission --
      // matching "otherwise say Marked for review" rather than claiming
      // a report was sent somewhere it wasn't.
      const el = document.getElementById(`report-feedback-${data.id}`);
      if (el) el.innerHTML = ` <span class="note info" style="border:none;padding:0;margin:0;display:inline;">Marked for review.</span>`;
    }
    else if (action === "open-incident-center") { APP.screen="incident-center"; render(); }
    else if (action === "incident-contained") { DEMO_INCIDENT.status="CONTAINED"; DEMO_INCIDENT.action_log.unshift({timestamp:new Date().toISOString(),label:"Incident marked contained"}); render(); }
    else if (action === "incident-resolved") { DEMO_INCIDENT.status="RESOLVED"; DEMO_INCIDENT.action_log.unshift({timestamp:new Date().toISOString(),label:"Incident marked resolved"}); render(); }
    else if (action === "focus-infra-node") {
      const row = document.getElementById(`infra-row-${data.ip}`);
      if (row) {
        row.scrollIntoView({ behavior: "smooth", block: "center" });
        row.classList.add("halo-row-flash");
        setTimeout(() => row.classList.remove("halo-row-flash"), 1200);
      }
    }
    else if (action === "view-geo") {
      geoInfraData = APP.demoMode ? DEMO_GEO : await api.geoInfrastructure();
      APP.screen = "geo-infrastructure"; render();
    }
    else if (action === "view-timeline") {
      timelineData = APP.demoMode ? DEMO_TIMELINE : await api.timeline();
      APP.screen = "timeline"; render();
    }
    else if (action === "open-email") {
      APP.currentEmailId = data.id;
      if (APP.demoMode) {
        const rec = DEMO_EMAILS.find((e) => e.id === data.id);
        emailDetailData = { ...rec, raw_result_json: JSON.stringify(rec.raw_result) };
      } else {
        emailDetailData = await api.getEmail(data.id);
      }
      APP.screen = "email-detail"; render();
    }
    else if (action === "back-dashboard") {
      APP.screen = "student-dashboard"; render();
      if (!APP.demoMode) await loadStudentDashboard();
      else renderDemoStudentLists();
    }
    else if (action === "open-campaign") {
      APP.currentCampaignId = data.id;
      campaignDetailData = APP.demoMode ? DEMO_CAMPAIGN : await api.getCampaign(data.id);
      APP.screen = "campaign-detail"; render();
    }
    else if (action === "back-institution") {
      APP.screen = "institution-dashboard"; render();
      if (!APP.demoMode) await loadInstitutionDashboard();
      else renderDemoCampaignList();
    }
    else if (action === "set-status") {
      if (!APP.demoMode) {
        await api.setCampaignStatus(APP.currentCampaignId, data.status);
        campaignDetailData = await api.getCampaign(APP.currentCampaignId);
      } else {
        DEMO_CAMPAIGN.status = data.status; // keep demo state consistent across navigation
        campaignDetailData = DEMO_CAMPAIGN;
      }
      render();
    }
  } catch (e) {
    if (e.status === 401) { APP.user = null; APP.screen = "role-select"; render(); return; }
    if (e.status === 403) { APP.error = "You don't have permission to view this page."; render(); return; }
    if (e.status === 404) { APP.error = "Not found."; render(); return; }
    // A raw "Failed to fetch" (network error / backend unreachable) must
    // never reach the user verbatim -- translate it to a plain HALO
    // message. Anything else from the API layer is already a message
    // written for end users (see api.js's request()), so it passes
    // through unchanged.
    const isNetworkError = /Failed to fetch|NetworkError|ERR_CONNECTION/i.test(e.message || "");
    APP.error = isNetworkError ? "HALO couldn't connect right now. Please try again." : (e.message || "Something went wrong.");
    render();
  }
}

// After the initial render lands on a dashboard (e.g. session already
// existed on page load), boot() above triggers the data load.
boot();

</script>
